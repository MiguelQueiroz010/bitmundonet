<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020814" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="#020814"/>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#33aaff" stroke-width="6" opacity="0.4"/>

  <!-- Emoji Content -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" 
        font-family="system-ui, -apple-system, 'Segoe UI Emoji', 'Noto Color Emoji', 'Apple Color Emoji', sans-serif" 
        font-size="240" filter="url(#shadow)">⚡</text>
</svg>