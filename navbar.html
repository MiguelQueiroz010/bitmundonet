<style>
/* Local Navbar specific overrides if needed, 
   but ideally should be in style.css. 
   Putting some layout specific here for the partial. */

#navbar {
    width: 100%;
    z-index: 1000;
    transition: top 0.3s;
}

#head {
    width: 100%;
    position: relative;
    display: block;
    overflow: hidden;
}

.banner-container {
    position: relative;
    width: 100%;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent; /* Changed from #000 */
    overflow: hidden;
}

#backWall {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.8; /* Slightly higher for more visibility */
}

.logo-overlay {
    position: relative;
    z-index: 2;
    width: auto;
    max-width: 80%;
}

.nav-bar-strip {
    width: 100%;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    padding: 0.5rem 2rem;
    height: 70px;
}

.nav-links {
    display: flex;
    gap: 2rem;
    align-items: center;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-main);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    border-radius: var(--radius-md);
    transition: all 0.3s ease;
}

.nav-item:hover {
    background: rgba(255,255,255,0.1);
    color: var(--primary);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
}

.nav-item img {
    height: 24px;
    width: auto;
}

/* Mobile Toggle */
#mobile-toggle {
    display: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: white;
}

/* ══════════════════════════════════════════════════
   FLOW MENU (Ferramentas - Desktop)
   ══════════════════════════════════════════════════ */
.nav-dropdown-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
}

.nav-dropdown-wrapper .nav-chevron {
    transition: transform 0.25s ease;
    margin-left: 4px;
    opacity: 0.7;
}

.nav-dropdown-wrapper:hover .nav-chevron,
.nav-dropdown-wrapper:focus-within .nav-chevron {
    transform: rotate(180deg);
    opacity: 1;
}

/* Manter o botão Ferramentas iluminado enquanto o menu estiver aberto */
.nav-dropdown-wrapper:hover > .nav-item,
.nav-dropdown-wrapper:focus-within > .nav-item,
.nav-dropdown-wrapper.open > .nav-item {
    background: rgba(255,255,255,0.1) !important;
    color: var(--primary) !important;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3) !important;
}

.nav-flow-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    left: auto;
    transform: translateY(-6px) scale(0.98);
    width: 290px;
    background: rgba(10, 11, 18, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(59, 130, 246, 0.35);
    border-radius: 14px;
    padding: 0.75rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75), 0 0 25px rgba(59, 130, 246, 0.2);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0.2s;
    z-index: 1050;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
}

/* Hover bridge estável para não fechar o menu ao mover o mouse */
.nav-flow-menu::before {
    content: '';
    position: absolute;
    top: -16px;
    left: -20px;
    right: -20px;
    height: 20px;
    background: transparent;
}

/* Seta apontando exatamente para o botão Ferramentas */
.nav-flow-menu::after {
    content: '';
    position: absolute;
    top: -6px;
    right: 46px;
    transform: rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(10, 11, 18, 0.98);
    border-left: 1px solid rgba(59, 130, 246, 0.35);
    border-top: 1px solid rgba(59, 130, 246, 0.35);
}

.nav-dropdown-wrapper:hover .nav-flow-menu,
.nav-dropdown-wrapper:focus-within .nav-flow-menu,
.nav-dropdown-wrapper.open .nav-flow-menu {
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
    transform: translateY(0) scale(1);
}

.flow-menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.2rem 0.4rem 0.5rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 0.4rem;
}

.flow-header-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
}

.flow-header-badge {
    font-size: 0.65rem;
    font-weight: 700;
    color: #60a5fa;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.3);
    padding: 0.15rem 0.45rem;
    border-radius: 99px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.flow-menu-list {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    max-height: 320px;
    overflow-y: auto;
}

.flow-menu-list::-webkit-scrollbar {
    width: 4px;
}
.flow-menu-list::-webkit-scrollbar-thumb {
    background: rgba(59, 130, 246, 0.3);
    border-radius: 4px;
}

.flow-menu-item {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.55rem 0.75rem;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text-main);
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid transparent;
    user-select: none;
}

.flow-menu-item:hover,
.flow-menu-item:focus {
    background: rgba(59, 130, 246, 0.16);
    border-color: rgba(59, 130, 246, 0.4);
    color: #ffffff;
    box-shadow: inset 0 0 12px rgba(59, 130, 246, 0.15);
}

.flow-menu-item.active {
    background: rgba(59, 130, 246, 0.22);
    border-color: #3b82f6;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
}

.flow-item-icon {
    font-size: 1.15rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
}
.flow-item-icon img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}

.flow-item-content {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
}

.flow-item-name {
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: none;
}

.flow-menu-item.active .flow-item-name {
    color: #60a5fa;
}

.flow-item-sub {
    font-size: 0.68rem;
    color: var(--text-muted);
    line-height: 1.1;
    text-transform: none;
}

.flow-item-arrow {
    font-size: 0.8rem;
    color: var(--text-muted);
    transition: transform 0.15s ease, color 0.15s ease;
}

.flow-menu-item:hover .flow-item-arrow,
.flow-menu-item.active .flow-item-arrow {
    color: var(--primary);
    transform: translateX(3px);
}

.flow-menu-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 0.4rem 0;
}

/* "Ver Tudo" Option */
.flow-menu-all {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #93c5fd;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    user-select: none;
}

.flow-menu-all:hover,
.flow-menu-all:focus {
    background: rgba(59, 130, 246, 0.22);
    border-color: #60a5fa;
    color: #ffffff;
    box-shadow: 0 0 14px rgba(59, 130, 246, 0.35);
}

.flow-all-icon {
    font-size: 1.15rem;
    color: #60a5fa;
    line-height: 1;
}

.flow-all-text {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.flow-all-title {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #ffffff;
}

.flow-all-sub {
    font-size: 0.68rem;
    color: rgba(255, 255, 255, 0.6);
}

.flow-all-arrow {
    font-size: 0.95rem;
    color: #60a5fa;
    transition: transform 0.15s ease;
}

.flow-menu-all:hover .flow-all-arrow {
    transform: translateX(4px);
}

/* ══════════════════════════════════════════════════
   FLOW MENU (Mobile Accordion)
   ══════════════════════════════════════════════════ */
.mobile-tools-group {
    display: flex;
    flex-direction: column;
    width: 100%;
}

.mobile-tools-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    cursor: pointer;
}

.mobile-chevron {
    transition: transform 0.3s ease;
    font-size: 0.75rem;
    opacity: 0.7;
}

.mobile-tools-group.open .mobile-chevron {
    transform: rotate(180deg);
}

.mobile-tools-sub {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding-left: 1rem;
    border-left: 2px solid rgba(59, 130, 246, 0.3);
    margin-left: 1rem;
    margin-top: 0.2rem;
}

.mobile-tools-group.open .mobile-tools-sub {
    max-height: 600px;
}

.mobile-flow-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.8rem;
    border-radius: 6px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: all 0.2s;
}

.mobile-flow-item:hover {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.3);
    color: #60a5fa;
}

.mobile-flow-all {
    margin-top: 0.3rem;
    border: 1px solid rgba(59, 130, 246, 0.35);
    background: rgba(59, 130, 246, 0.12);
    color: #93c5fd;
    font-weight: 600;
}

/* Dropdown Menu (Mobile) */
#dropdown {
    position: fixed;
    top: 70px;
    left: 0;
    width: 100%;
    height: calc(100vh - 70px);
    background: rgba(10, 11, 16, 0.95);
    backdrop-filter: blur(15px);
    transform: translateX(100%);
    transition: transform 0.4s ease;
    z-index: 999;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
}

#dropdown.active {
    transform: translateX(0);
}

/* Responsive */
@media (max-width: 768px) {
    .nav-links, #pc_nav { 
        display: none !important; 
    }
    #mobile-toggle { 
        display: block !important; 
    }
    .brand-area div {
        font-size: 1rem !important;
    }
    .banner-container { 
        height: 220px !important; 
    }
    .logo-overlay { 
        max-width: 85%;
    }
    .nav-bar-strip { 
        padding: 0 1rem;
    }
}
</style>
