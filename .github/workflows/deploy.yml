name: Deploy to GitHub Pages
# Triggering cleanup commit

on:
  push:
    branches:
      - master # Ou a sua branch principal
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions
  schedule:
    - cron: '0 6 * * *' # Executa todo dia às 06:00 UTC para sincronizar novos projetos do Firestore

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # needed so sitemap <lastmod> can use real git dates

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Inject Firebase Secrets
        run: |
          sed -e "s/\${FIREBASE_API_KEY}/${{ secrets.FIREBASE_API_KEY }}/g" \
              -e "s/\${FIREBASE_AUTH_DOMAIN}/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" \
              -e "s/\${FIREBASE_PROJECT_ID}/${{ secrets.FIREBASE_PROJECT_ID }}/g" \
              -e "s/\${FIREBASE_STORAGE_BUCKET}/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" \
              -e "s/\${FIREBASE_MESSAGING_SENDER_ID}/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" \
              -e "s/\${FIREBASE_APP_ID}/${{ secrets.FIREBASE_APP_ID }}/g" \
              -e "s/\${FIREBASE_MEASUREMENT_ID}/${{ secrets.FIREBASE_MEASUREMENT_ID }}/g" \
              scripts/firebase-config.template.js > scripts/firebase-config.js
          sed -e "s/\${FIREBASE_API_KEY}/${{ secrets.FIREBASE_API_KEY }}/g" \
              -e "s/\${FIREBASE_AUTH_DOMAIN}/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" \
              -e "s/\${FIREBASE_PROJECT_ID}/${{ secrets.FIREBASE_PROJECT_ID }}/g" \
              -e "s/\${FIREBASE_STORAGE_BUCKET}/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" \
              -e "s/\${FIREBASE_MESSAGING_SENDER_ID}/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" \
              -e "s/\${FIREBASE_APP_ID}/${{ secrets.FIREBASE_APP_ID }}/g" \
              -e "s/\${FIREBASE_MEASUREMENT_ID}/${{ secrets.FIREBASE_MEASUREMENT_ID }}/g" \
              firebase-messaging-sw.template.js > firebase-messaging-sw.js
          sed -e "s/\${VAPID_PUBLIC_KEY}/${{ secrets.VAPID_PUBLIC_KEY }}/g" \
              scripts/notifications.template.js > scripts/notifications.js

      - name: Inject EmailJS Secrets
        run: |
          sed -e "s/\${EMAILJS_SERVICE_ID}/${{ secrets.EMAILJS_SERVICE_ID }}/g" \
              -e "s/\${EMAILJS_TEMPLATE_ID}/${{ secrets.EMAILJS_TEMPLATE_ID }}/g" \
              -e "s/\${EMAILJS_PUBLIC_KEY}/${{ secrets.EMAILJS_PUBLIC_KEY }}/g" \
              scripts/emailjs-config.template.js > scripts/emailjs-config.js

      - name: Build Static Site & SEO (SSG)
        run: node scripts/build_static.js
        env:
          # Optional: override the IDs in seo.config.json (empty = use the file)
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_DOWNLOAD_LABEL: ${{ secrets.GOOGLE_ADS_DOWNLOAD_LABEL }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Prepare Workspace (Ensure ignored files are published)
        run: rm -f .gitignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages # Branch onde o site processado será hospedado

      - name: Notify IndexNow (Bing/Yandex) about new or changed pages
        if: github.event_name != 'pull_request'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          sleep 90 # let GitHub Pages publish the key file first
          node scripts/indexnow.js 2 || true
